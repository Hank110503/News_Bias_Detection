model_name: ./models/Qwen2.5-VL-7B-Instruct
dataset_path: data/processed/converted/bishe_schema_stage2_predicted_obs_reason_merged.jsonl
output_dir: outputs/stage2_v2
adapter_path: outputs/stage1/final_adapter
eval_ratio: 0.05
seed: 42
learning_rate: 1.0e-5
num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
max_seq_length: 1024
max_image_pixels: 262144
bf16: true
gradient_checkpointing: true
logging_steps: 10
save_steps: 100
eval_steps: 500
save_total_limit: 2
warmup_ratio: 0.03
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
torch_dtype: auto
device_map: auto
dataloader_num_workers: 0
report_to: tensorboard
skip_oom_batches: true
skip_oom_eval_batches: true
eval_strategy: steps
save_strategy: steps
logging_strategy: steps
resume_from_checkpoint: latest
